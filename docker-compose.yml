# Postgres local para Winzer v2. Puerto 5442 para no chocar con otros Postgres locales.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: winzer
      POSTGRES_PASSWORD: winzer
      POSTGRES_DB: winzer
    ports:
      - '5442:5432'
    volumes:
      - winzer-pg:/var/lib/postgresql/data
      - ./packages/db/docker-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U winzer']
      interval: 3s
      retries: 20
  # Almacenamiento de adjuntos compatible con S3 (ADR 0013). En producción: Cloudflare R2.
  # s3mock acepta cualquier credencial y no valida firmas: solo para desarrollo y CI.
  s3:
    image: adobe/s3mock:4.4.0
    ports:
      - '9442:9090'
volumes:
  winzer-pg:
